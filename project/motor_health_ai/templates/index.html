<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Motor Health Assessment AI</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #1a1a2e; font-size: 1.6rem; }
    .card { background: white; border-radius: 10px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.85rem; color: #444; }
    input, select { width: 100%; padding: 9px; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    button { width: 100%; padding: 12px; background: #1f6feb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button:hover { background: #388bfd; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    .check { background: #f9f9f9; border-left: 4px solid #ccc; padding: 10px 14px; margin-bottom: 10px; border-radius: 4px; }
    .check.pass-card { border-left-color: green; }
    .check.fail-card { border-left-color: red; }
    #aiReport { white-space: pre-wrap; font-size: 0.88rem; line-height: 1.7; background: #f9f9f9; padding: 16px; border-radius: 8px; }
    #results { display: none; }
    .overall { padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; }
    .healthy  { background: #d4edda; color: #155724; }
    .marginal { background: #fff3cd; color: #856404; }
    .critical { background: #f8d7da; color: #721c24; }
    #loader { display:none; text-align:center; padding: 20px; color: #555; }
  </style>
</head>
<body>

<h1>⚡ Induction Motor Health Assessment AI</h1>
<p style="color:#666; margin-top:-10px;">IS 900 · IEEE 43 · IS 12075</p>

<div class="card">
  <label>Motor Voltage</label>
  <select id="voltage">
    <option value="0.415">415V (Low Tension)</option>
    <option value="6.6">6.6kV (High Tension)</option>
  </select>

  <label>IR @ 1 Minute (MΩ)</label>
  <input type="number" id="ir_1min" placeholder="e.g. 2.5" step="0.01" />

  <label>IR @ 10 Minutes (MΩ)</label>
  <input type="number" id="ir_10min" placeholder="e.g. 3.8" step="0.01" />

  <label>DC Winding Resistance (Ω)</label>
  <input type="number" id="dc_resistance" placeholder="e.g. 0.051" step="0.001" />

  <label>Vibration (mm/sec)</label>
  <input type="number" id="vibration" placeholder="e.g. 1.8" step="0.1" />

  <button onclick="runAssessment()">⚡ Run AI Health Assessment</button>
</div>

<div id="loader">⏳ Analysing motor data, please wait...</div>

<div id="results">
  <div class="overall" id="overallBanner"></div>

  <div class="card">
    <h3>Standards Check Results</h3>
    <div id="checksGrid"></div>
  </div>

  <div class="card">
    <h3>🤖 AI Diagnostic Report</h3>
    <div id="aiReport"></div>
  </div>
</div>

<script>
async function runAssessment() {
  const ir_1min       = document.getElementById('ir_1min').value;
  const ir_10min      = document.getElementById('ir_10min').value;
  const dc_resistance = document.getElementById('dc_resistance').value;
  const vibration     = document.getElementById('vibration').value;
  const voltage_kv    = document.getElementById('voltage').value;

  if (!ir_1min || !ir_10min || !dc_resistance || !vibration) {
    alert('Please fill in all fields.');
    return;
  }

  document.getElementById('loader').style.display  = 'block';
  document.getElementById('results').style.display = 'none';

  try {
    const resp = await fetch('/assess', {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify({ voltage_kv, ir_1min, ir_10min, dc_resistance, vibration })
    });
    const data = await resp.json();
    if (!data.success) throw new Error(data.error);
    renderResults(data.results, data.ai_report);
  } catch(e) {
    alert('Error: ' + e.message);
  } finally {
    document.getElementById('loader').style.display = 'none';
  }
}

function renderResults(r, aiText) {
  const status = r.overall.status;
  const banner = document.getElementById('overallBanner');
  banner.textContent = status + ' — ' + r.overall.message;
  banner.className   = 'overall ' +
    (status.includes('HEALTHY') ? 'healthy' : status.includes('MARGINAL') ? 'marginal' : 'critical');

  const grid = document.getElementById('checksGrid');
  grid.innerHTML = '';
  ['check1','check2','check3','check4','check5'].forEach(k => {
    const c   = r[k];
    const cls = c.status === 'PASS' ? 'pass-card' : 'fail-card';
    const badge = c.status === 'PASS'
      ? '<span class="pass">✅ PASS</span>'
      : '<span class="fail">❌ FAIL</span>';
    grid.innerHTML += `
      <div class="check ${cls}">
        <b>${c.name}</b> ${badge}<br>
        Measured: <b>${c.measured} ${c.unit}</b> &nbsp;|&nbsp; Limit: ${c.limit}
        ${c.pi_condition ? '<br>PI Condition: <b>' + c.pi_condition + '</b>' : ''}
      </div>`;
  });

  document.getElementById('aiReport').textContent = aiText;
  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
